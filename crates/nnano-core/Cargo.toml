[package]
name = "nnano-core"
description = "Editor semantics for nnano: rope buffer, nano operations, config registry. No terminal knowledge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["editor", "text", "rope", "buffer"]
categories = ["text-editors"]
# Internal crate: the binary is what ships.
publish = false

[dependencies]
ropey = "=1.6.1"
regex-lite = "=0.1.9"
toml = "=0.9.12"
unicode-width = "=0.2.3"
unicode-segmentation = "=1.13.3"
